<div class="fadein animation-duration-1000 auth-card login-card">
  <button class="brand-button" type="button" routerLink="/es-Es/home" aria-label="Ir al inicio">
    <img src="assets/images/logo-realg.png" alt="Real G4 Sneakers" class="brand-logo" />
  </button>

  <header class="form-header">
    <h1 id="login-title" class="auth-title">Login</h1>
  </header>

  <form class="auth-form" [formGroup]="formLogin" (ngSubmit)="login()" aria-labelledby="login-title">
    <div class="form-field">
      <p-floatLabel class="w-full">
        <input pInputText formControlName="email" id="email" class="w-full" />
        <label for="email">Email</label>
      </p-floatLabel>
    </div>

    <div class="form-field">
      <p-floatLabel class="w-full">
        <p-password inputId="password" formControlName="password" [toggleMask]="true" [feedback]="false" />
        <label for="password">Contrase&ntilde;a</label>
      </p-floatLabel>
    </div>

    <p-button type="submit" label="Iniciar Sesi&oacute;n" styleClass="auth-submit w-full" />

    <div class="auth-link-copy">
      <span>&iquest;A&uacute;n no tienes una cuenta?</span>
      <a routerLink="/auth/registro">Reg&iacute;strate</a>
    </div>
  </form>
</div>
