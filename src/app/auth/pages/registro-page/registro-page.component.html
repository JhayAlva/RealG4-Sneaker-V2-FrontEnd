<div class="fadein animation-duration-1000 auth-card register-card">
  <button class="brand-button" type="button" routerLink="/es-Es/home" aria-label="Ir al inicio">
    <img src="assets/images/logo-realg.png" alt="Real G4 Sneakers" class="brand-logo" />
  </button>

  <header class="form-header">
    <h1 id="registro-title" class="auth-title">Registro</h1>
  </header>

  <form class="auth-form" [formGroup]="formRegistro" (ngSubmit)="registro()" aria-labelledby="registro-title">
    <div class="fields-grid">
      <div class="form-field">
        <p-floatLabel class="w-full">
          <input pInputText formControlName="nombre" id="name" class="w-full" />
          <label for="name">Nombre</label>
        </p-floatLabel>
        <small *ngIf="isValidField('nombre')" class="field-error">Debe tener m&aacute;s de 3 caracteres</small>
      </div>

      <div class="form-field">
        <p-floatLabel class="w-full">
          <input pInputText formControlName="apellidos" id="apellido" class="w-full" />
          <label for="apellido">Apellidos</label>
        </p-floatLabel>
        <small *ngIf="isValidField('apellidos')" class="field-error">Debe tener m&aacute;s de 3 caracteres</small>
      </div>

      <div class="form-field">
        <p-floatLabel class="w-full">
          <input pInputText formControlName="email" id="email" class="w-full" />
          <label for="email">Email</label>
        </p-floatLabel>
      </div>

      <div class="form-field">
        <p-floatLabel class="w-full">
          <input pInputText formControlName="email2" id="repEmail" class="w-full" />
          <label for="repEmail">Repetir email</label>
        </p-floatLabel>
        <small *ngIf="isValidField('email2')" class="field-error">Los emails deben ser iguales</small>
      </div>

      <div class="form-field">
        <p-floatLabel class="w-full">
          <p-password inputId="password" [toggleMask]="true" formControlName="password" [feedback]="false" />
          <label for="password">Contrase&ntilde;a</label>
        </p-floatLabel>
      </div>

      <div class="form-field">
        <p-floatLabel class="w-full">
          <p-password inputId="password2" [toggleMask]="true" formControlName="password2" [feedback]="false" />
          <label for="password2">Repetir contrase&ntilde;a</label>
        </p-floatLabel>
        <small *ngIf="isValidField('password2')" class="field-error">Las contrase&ntilde;as deben ser iguales</small>
      </div>
    </div>

    <p-button [disabled]="formRegistro.invalid" type="submit" label="Registrarse" styleClass="auth-submit w-full"></p-button>

    <div class="auth-link-copy">
      <span>&iquest;Ya tienes una cuenta?</span>
      <a routerLink="/auth/login">Inicia sesi&oacute;n</a>
    </div>
  </form>
</div>
