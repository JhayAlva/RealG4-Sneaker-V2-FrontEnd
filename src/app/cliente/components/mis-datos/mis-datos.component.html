<h2>Perfil</h2>
<hr>

<div class="profile-form-shell">
  <div class="profile-form-card">
    <form [formGroup]="formIniciopanel" (ngSubmit)="UpdateDatosCliente()">
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" pInputText name="nombre" formControlName="nombre" />
        </div>

        <div class="form-group">
          <label for="apellidos">Apellidos</label>
          <input id="apellidos" type="text" pInputText name="apellidos" formControlName="apellidos" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Contrase&ntilde;a</label>
          <input id="password" type="password" pInputText formControlName="password" />
        </div>

        <div class="form-group">
          <label for="newpassword">Nueva contrase&ntilde;a</label>
          <input id="newpassword" type="password" pInputText name="newpassword" formControlName="newpassword"/>
        </div>
      </div>

      <div class="form-row form-row-birth">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" pInputText name="email" formControlName="email"/>
        </div>

        <div class="form-group">
          <label for="dia">D&iacute;a</label>
          <p-dropdown [options]="dias" placeholder="Selecciona el d&iacute;a" formControlName="dia"></p-dropdown>
        </div>

        <div class="form-group">
          <label for="mes">Mes</label>
          <p-dropdown [options]="meses" placeholder="Selecciona el mes" formControlName="mes"></p-dropdown>
        </div>

        <div class="form-group">
          <label for="anio">A&ntilde;o</label>
          <p-dropdown [options]="anios" placeholder="Selecciona el a&ntilde;o" formControlName="anio"></p-dropdown>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group full-width">
          <label for="telefono">Tel&eacute;fono</label>
          <input id="telefono" type="text" pInputText name="telefono" formControlName="telefono" />
        </div>
      </div>

      <div class="form-actions">
        <button pButton type="submit" label="Enviar" class="submit-btn" [disabled]="!this.formIniciopanel.valid"></button>
      </div>
    </form>
  </div>
</div>
