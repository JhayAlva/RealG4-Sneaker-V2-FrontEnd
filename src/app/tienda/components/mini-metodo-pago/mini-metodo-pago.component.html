<div class="payment-card">
  <div class="payment-heading">
    <span>Metodo de pago</span>
    <h3>Elige como quieres pagar</h3>
  </div>

  <div class="method-grid">
    <button
      class="method-card"
      type="button"
      (click)="seleccionarMetodo('tarjeta')"
      [ngClass]="{'selected': metodoSeleccionado === 'tarjeta'}">
      <span class="method-icon">
        <img src="../../../../assets/images/logo-pagotarjeta.png" alt="Pago con tarjeta">
      </span>
      <span class="method-copy">
        <strong>Tarjeta de credito</strong>
      </span>
    </button>

    <button
      class="method-card"
      type="button"
      (click)="seleccionarMetodo('paypal')"
      [ngClass]="{'selected': metodoSeleccionado === 'paypal'}">
      <span class="method-icon">
        <img src="../../../../assets/images/paypal-logo.webp" alt="Pago con PayPal">
      </span>
      <span class="method-copy">
        <strong>PayPal</strong>
      </span>
    </button>
  </div>

  <div *ngIf="metodoSeleccionado === 'tarjeta'" class="card-form">
    <div class="form-field full">
      <label for="nombreTarjeta">Nombre en la tarjeta</label>
      <input
        pInputText
        [(ngModel)]="datosPago.titularTarjeta"
        id="nombreTarjeta"
        placeholder="Nombre en la tarjeta" />
    </div>

    <div class="form-field">
      <label for="numeroTarjeta">Numero de tarjeta</label>
      <input
        pInputText
        [(ngModel)]="datosPago.numeroTarjeta"
        (blur)="onCardNumberChange()"
        id="numeroTarjeta"
        maxlength="16"
        placeholder="1234 5678 9012 3456" />
    </div>

    <div class="form-field">
      <label for="fechaExp">Fecha de expiracion</label>
      <input
        pInputText
        maxlength="7"
        (input)="autoFormatMonth()"
        (keydown)="validateInput($event)"
        [(ngModel)]="datosPago.fechaCaducidad"
        id="fechaExp"
        placeholder="MM/AAAA" />
    </div>

    <div *ngIf="cardNumberError && cardNumberTouched" class="error-message full">
      Numero de tarjeta invalido.
    </div>

    <div *ngIf="fechaCaducidadError" class="error-message full">
      Fecha de caducidad invalida.
    </div>

    <div class="form-field">
      <label for="cvv">CVV</label>
      <input
        pInputText
        id="cvv"
        [(ngModel)]="datosPago.cvv"
        (blur)="onCvvBlur()"
        placeholder="123"
        maxlength="4" />
    </div>

    <div *ngIf="cvvError" class="error-message full">
      CVV invalido.
    </div>
  </div>

  <div *ngIf="metodoSeleccionado === 'paypal'" class="paypal-note">
    Seras redirigido a PayPal para completar tu pago.
  </div>

  <div class="payment-actions">
    <button type="button" class="cancel-button" (click)="ParaAtras()">Cancelar</button>
    <button type="button" class="confirm-button" [disabled]="!formValid()" (click)="submit()">Confirmar pago</button>
  </div>
</div>
